# Dependabot version updates. Security updates are enabled in the repo settings
# and ignore the cooldown, so fixes for known vulnerabilities arrive immediately.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5 # wait 5 days after a release before proposing it
    open-pull-requests-limit: 10
    groups:
      # dependabot-automerge.yml auto-merges this group by name; don't rename
      # it without updating the workflow.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
