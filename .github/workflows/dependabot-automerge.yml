name: Dependabot auto-merge

# Enables GitHub auto-merge on Dependabot PRs that are either:
#   - a security update (any semver level), or
#   - an npm patch version update.
# GitHub only performs the merge once every required status check (CI / build)
# passes. Minor/major version updates and GitHub Actions updates are left for
# manual review.

on:
  pull_request:

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          # needs "Dependabot alerts: read" to tell security updates apart
          alert-lookup: true
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.ghsa-id != '' ||
          (steps.meta.outputs.package-ecosystem == 'npm_and_yarn' &&
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A PAT, not GITHUB_TOKEN: merges made with GITHUB_TOKEN don't trigger
          # other workflows, so deploy.yml would never run for them.
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
